# Builds docs/index.html and docs/en/index.html from src/ and the data files, then publishes docs/ to
# GitHub Pages. Pull requests only build, so a broken build shows up before merging.
# Requires Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer pull request build replaces an older one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the built page
        run: |
          test -s docs/index.html
          grep -q 'id="thu-campus-data"' docs/index.html
          test -s docs/en/index.html
          grep -q '<html lang="en">' docs/en/index.html
          grep -q 'id="thu-campus-data"' docs/en/index.html
          test -s docs/models/thu-library.glb
          ls -l docs/index.html docs/en/index.html docs/data/campus-geo.json docs/models/thu-library.glb
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
