<section id="tunghai-campus" class="thu-app" aria-labelledby="thu-title">
  <header class="thu-header">
    <div>
      <p class="thu-eyebrow">TUNGHAI UNIVERSITY <span></span> {{eyebrowPlace}}</p>
      <h1 id="thu-title">{{titleMain}} <span>{{titleSub}}</span></h1>
    </div>
    <div class="thu-header-tools">
      <a class="btn thu-lang" href="{{otherHref}}" hreflang="{{otherLang}}" lang="{{otherLang}}" title="{{otherTitle}}">{{otherLabel}}</a>
      <div class="thu-view" role="group" aria-label="{{viewGroup}}">
        <button class="btn" type="button" data-view="orbit" aria-pressed="true">{{viewOrbit}}</button>
        <button class="btn" type="button" data-view="top" aria-pressed="false">{{viewTop}}</button>
      </div>
    </div>
  </header>
  <div class="thu-layout">
    <div class="thu-map" aria-label="{{mapLabel}}">
      <div class="thu-canvas"></div>
      <div class="thu-labels"></div>
      <button class="btn thu-panel-toggle" type="button" aria-controls="thu-sidebar" aria-expanded="true" aria-label="{{panelHide}}" title="{{panelHide}}"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="thu-compass" aria-label="{{compassLabel}}"><span>{{compass}}</span><i></i></div>
      <div class="thu-map-controls" role="group" aria-label="{{controlsLabel}}">
        <button class="btn" type="button" data-action="in" aria-label="{{zoomIn}}">＋</button>
        <button class="btn" type="button" data-action="out" aria-label="{{zoomOut}}">−</button>
        <button class="btn" type="button" data-action="home" aria-label="{{home}}">⌂</button>
        <button class="btn" type="button" data-action="fullscreen" aria-label="{{fullscreen}}" title="{{fullscreen}}" aria-pressed="false"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="thu-map-footer">
        <p class="thu-help">{{help}}</p>
        <p class="thu-scale"><span></span><b>100 m</b></p>
      </div>
      <p class="thu-error" role="alert" hidden>{{error}}</p>
    </div>
    <aside class="thu-sidebar" id="thu-sidebar">
      <h2 class="thu-panel-title">{{panelTitle}}</h2>
      <label class="thu-picker-label" for="thu-destination">{{picker}}</label>
      <select class="form-select" id="thu-destination"></select>
      <article class="thu-detail" aria-live="polite">
        <p class="thu-area"></p>
        <h3 class="thu-place"></h3>
        <p class="thu-english" lang="{{subtitleLang}}"></p>
        <p class="thu-description"></p>
        <div class="thu-detail-links">
          <a class="thu-place-source" href="https://thupr.thu.edu.tw/traffic.php" target="_blank" rel="noopener noreferrer">{{source}}</a>
          <a class="thu-place-aerial" target="_blank" rel="noopener noreferrer" hidden>{{aerial}}</a>
        </div>
      </article>
      <button type="button" class="btn thu-focus" data-action="focus">{{focus}} <span aria-hidden="true">↗</span></button>
    </aside>
  </div>
  <footer class="thu-sources">
    <p>{{note}}</p>
    <p><a href="https://thupr.thu.edu.tw/traffic.php" target="_blank" rel="noopener noreferrer">{{campusMap}}</a><span>·</span><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a><span>·</span><a href="{{dataPath}}" download>{{mapData}}</a><span>·</span><a href="https://registry.opendata.aws/terrain-tiles/" target="_blank" rel="noopener noreferrer">{{elevation}}</a></p>
  </footer>
</section>
